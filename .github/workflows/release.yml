name: Release

# Push a tag that matches VERSION (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build the
# DMG and publish it, with SHA-256 checksums, as the latest GitHub Release.
#
# Optional repository secrets for a signed + notarized build (otherwise the DMG is ad-hoc signed):
#   MACOS_CERTIFICATE_P12      base64 of a "Developer ID Application" .p12 (cert + private key)
#   MACOS_CERTIFICATE_PASSWORD password of that .p12
#   GLINT_DEVELOPER_ID         signing identity, e.g. "Developer ID Application: Jane Doe (TEAMID)"
#   NOTARY_APPLE_ID            Apple ID email used for notarization
#   NOTARY_TEAM_ID             10-character Team ID
#   NOTARY_PASSWORD            app-specific password for that Apple ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macOS 26 runner: the Xcode 26 SDK has FoundationModels for the on-device AI helper.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GLINT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION ($want)"; exit 1; }

      - name: Import Developer ID certificate and notary credentials
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.GLINT_DEVELOPER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$DEVELOPER_ID" ]; then
            echo "No signing secrets: building an ad-hoc signed DMG."; exit 0
          fi
          KC="$RUNNER_TEMP/glint.keychain-db"; KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "GLINT_DEVELOPER_ID=$DEVELOPER_ID" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            xcrun notarytool store-credentials glint --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$KC"
            echo "GLINT_NOTARY_PROFILE=glint" >> "$GITHUB_ENV"
            echo "GLINT_NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          fi

      - name: Build dist/Glint.app
        run: scripts/package.sh

      - name: Build and verify DMG
        run: scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$VERSION" ;; esac
          cd dist
          shasum -a 256 Glint-*.dmg > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Glint-*.dmg SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" Glint-*.dmg SHA256SUMS.txt --latest --generate-notes \
              --title "Glint $VERSION" --target "$GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Glint-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.sha256
