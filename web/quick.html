<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick Ask</title>
<style>
:root { --panel: rgba(255,255,255,.92); --line: rgba(0,0,0,.08); --text: #1d1b18; --muted: #75716a; --accent: #2f6f5e; --chip: rgba(0,0,0,.05); --danger: #c0392b; }
@media (prefers-color-scheme: dark) {
  :root { --panel: rgba(32,31,28,.92); --line: rgba(255,255,255,.1); --text: #ecebe7; --muted: #a29e95; --accent: #6cc3a6; --chip: rgba(255,255,255,.07); --danger: #ff7a6b; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text); padding: 10px; }
.wrap { height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4); overflow: hidden; }
.top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.logo { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; flex: none; }
input { flex: 1; border: 0; outline: none; background: transparent; font-size: 18px; color: var(--text); }
.out { flex: 1; overflow: auto; padding: 14px 18px; }
.hint { color: var(--muted); font-size: 13px; }
.hint kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.q { color: var(--muted); font-size: 13px; margin: 12px 0 4px; }
.q:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.a p { margin: 0 0 8px; } .a ul, .a ol { margin: 4px 0 8px; padding-left: 20px; }
.a code { font: 12.5px ui-monospace, Menlo, monospace; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
.a pre { background: var(--chip); padding: 8px 10px; border-radius: 8px; overflow: auto; }
.err { color: var(--danger); }
.typing::after { content: "▍"; color: var(--accent); animation: b 1s steps(2) infinite; } @keyframes b { 50% { opacity: 0; } }
.foot { display: flex; justify-content: space-between; padding: 8px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.foot button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">◐</div><input id="q" placeholder="Ask about anything you've seen…" autocomplete="off" autofocus></div>
  <div class="out" id="out"><div class="hint">Searches what's on your screen and in your memory. <kbd>Enter</kbd> to ask · <kbd>Esc</kbd> to close<br>Shortcuts: <kbd>/find</kbd> <kbd>/summarize</kbd> <kbd>/task</kbd> <kbd>/log</kbd></div></div>
  <div class="foot"><span id="status">Glint</span><button id="openMain">Open in Glint ↗</button></div>
</div>
<script>
const TOKEN = "__GLINT_TOKEN__";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const post = (msg) => window.webkit?.messageHandlers?.glint?.postMessage(msg);
function md(text) {
  return String(text || "").split(/```/).map((b, i) => {
    if (i % 2) return `<pre><code>${esc(b.replace(/^\w*\n/, ""))}</code></pre>`;
    const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    const out = []; let list = false;
    for (const line of b.split("\n")) {
      const li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
      if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
      if (list) { out.push("</ul>"); list = false; }
      if (line.trim()) out.push(`<p>${inline(line.replace(/^#+\s+/, ""))}</p>`);
    }
    if (list) out.push("</ul>");
    return out.join("");
  }).join("");
}
const LABEL = { search_memory: (i) => `Searched “${i.query}”`, get_recent_context: () => "Read recent screens", get_today_activity: () => "Reviewed today", list_tasks: () => "Loaded tasks", create_task: (i) => `Created task: ${i.title}`, update_task: () => "Updated task", read_memory: () => "Checked memory", update_memory: () => "Saved memory", read_user_bio: () => "Read bio", update_user_bio: () => "Updated bio", revise_session: () => "Updated session report", read_foreground_text: () => "Read the window", web_search: (i) => `Searched the web “${i.query || ""}”` };
let threadId = null, busy = false, lastUsed = 0;

async function ask() {
  const text = $("q").value.trim(); if (!text || busy) return;
  busy = true; $("q").value = ""; lastUsed = Date.now();
  if (!threadId) $("out").innerHTML = "";
  $("out").insertAdjacentHTML("beforeend", `<div class="q">${esc(text)}</div><div class="chips"></div><div class="a typing"></div>`);
  const chips = [...$("out").querySelectorAll(".chips")].at(-1), a = [...$("out").querySelectorAll(".a")].at(-1);
  let answer = ""; $("status").textContent = "Thinking…";
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "X-Glint-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify({ thread_id: threadId, message: text, scope: "quick" }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = raw.match(/^event: (.*)$/m)?.[1], data = JSON.parse(raw.match(/^data: (.*)$/m)?.[1] || "{}");
        if (ev === "thread") threadId = data.id;
        else if (ev === "text") { answer += data.delta; a.innerHTML = md(answer); }
        else if (ev === "tool") chips.insertAdjacentHTML("beforeend", `<span class="chip">${esc((LABEL[data.name] || (() => data.name))(data.input || {}))}</span>`);
        else if (ev === "done") { answer = data.answer || answer; a.innerHTML = md(answer); }
        else if (ev === "error") a.innerHTML = `<span class="err">${esc(data.message)}</span>`;
        else if (window.HS.renderers[ev]) { const el = document.createElement("div"); a.before(el); try { HS.renderers[ev](data, el); } catch (e) { console.error(e); } }
        $("out").scrollTop = $("out").scrollHeight;
      }
    }
  } catch (err) { a.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
  a.classList.remove("typing"); $("status").textContent = "Glint"; busy = false;
}
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); ask(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") post({ action: "closeQuickAsk" }); });
$("openMain").onclick = () => post({ action: "openMain", path: "ask" });
// Called by the native shell each time the panel opens. A fresh question after 5 idle minutes starts a new thread.
window.HS = { post, esc, md, toolLabels: LABEL, renderers: {}, onOpen: [] };
window.glintQuickOpened = () => {
  for (const f of HS.onOpen) { try { f(); } catch (e) { console.error(e); } }
  if (Date.now() - lastUsed > 5 * 60e3 && !busy) {
    threadId = null;
    $("out").innerHTML = '<div class="hint">Searches what\'s on your screen and in your memory. <kbd>Enter</kbd> to ask · <kbd>Esc</kbd> to close</div>';
  }
  $("q").focus(); $("q").select();
};
</script>
<!--FEATURE_TAGS-->
</body>
</html>
